services:
  # One-shot init: named volumes are created root-owned by Docker, but the
  # influxdb3-core image runs as uid/gid 1500 — without this, the server
  # fails on startup with "Permission denied" while initializing its catalog.
  influxdb3-init:
    image: busybox
    container_name: energymeter-influxdb3-init
    command: ["sh", "-c", "chown -R 1500:1500 /data /plugins"]
    volumes:
      - influxdb3-data:/data
      - influxdb3-plugins:/plugins

  # InfluxDB 3 Core: raw, full-resolution time-series storage.
  # No init-token env vars like v2 — the admin token must be created once via
  # the CLI after first start (see README/SETUP for the exact command).
  influxdb3-core:
    image: influxdb:3-core
    container_name: energymeter-influxdb3
    depends_on:
      influxdb3-init:
        condition: service_completed_successfully
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
    ports:
      - "8181:8181"
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data
      - influxdb3-plugins:/var/lib/influxdb3/plugins
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.2
    container_name: energymeter-grafana
    depends_on:
      - influxdb3-core
    # Bound to localhost only — the central nginx in the infra repo proxies
    # requests from outside at /energymeter to http://127.0.0.1:3000.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      # Read by the $INFLUXDB_TOKEN reference in provisioning/datasources/influxdb.yml
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      # Defaults keep plain "http://localhost:3000" working for local dev.
      # On the Pi, .env overrides these to serve Grafana under /energymeter
      # behind the central nginx reverse proxy.
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVER_SERVE_FROM_SUB_PATH:-false}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    restart: unless-stopped

  backend:
    # Not started by a plain "docker compose up" — only with "--profile full",
    # so local development can run InfluxDB/Grafana in Docker while running
    # Spring Boot directly from the IDE/mvn against the published ports.
    # Pulls the prebuilt ARM64 image from the release pipeline; use
    # docker-compose.local.yml to build from source instead.
    profiles: ["full"]
    image: ghcr.io/lolking91/energymeter:latest
    container_name: energymeter-backend
    depends_on:
      - influxdb3-core
    # Internal-only: no public UI, just a background poller + health endpoint
    # checked locally on the Pi (not proxied through nginx).
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      FOXESS_ENABLED: ${FOXESS_ENABLED:-true}
      FOXESS_API_KEY: ${FOXESS_API_KEY}
      FOXESS_DEVICE_SN: ${FOXESS_DEVICE_SN}
      INFLUXDB_URL: http://influxdb3-core:8181
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-energy_raw}
      SHELLY_SOLAR_HOST: ${SHELLY_SOLAR_HOST}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-300000}
    restart: unless-stopped

volumes:
  influxdb3-data:
  influxdb3-plugins:
  grafana-data:

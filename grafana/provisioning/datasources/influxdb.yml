# Provisions the InfluxDB 3 datasource automatically on Grafana startup.
# Uses the SQL query language (Flight SQL/gRPC under the hood) — the
# InfluxQL/Flux modes don't apply to InfluxDB 3.
apiVersion: 1

datasources:
  - name: InfluxDB - energy_raw
    uid: influxdb-energy-raw
    type: influxdb
    access: proxy
    url: http://influxdb3-core:8181
    isDefault: true
    jsonData:
      version: SQL
      dbName: energy_raw
      httpMode: POST
      insecureGrpc: true
    secureJsonData:
      token: $INFLUXDB_TOKEN
